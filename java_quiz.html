<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>TayyariExpress : Quizzos</title><meta content="width=device-width, initial-scale=1.0" name="viewport"><link href="img/icon.png" rel="icon"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet"><link href="lib/animate/animate.min.css" rel="stylesheet"><link href="lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet"><link href="css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"><style>body{ margin: 0; padding: 0; background: linear-gradient(135deg, #1e1e1e, #2c3e50); font-family: 'Segoe UI', sans-serif; height: 100vh} @keyframes bgFlow{ 0%{ background-position: 0% 50%} 50%{ background-position: 100% 50%} 100%{ background-position: 0% 50%}} .main-quiz{ display: flex; justify-content: center; align-items: center; min-height: 90vh; animation: bgFlow 10s infinite linear} .quiz-container{ background: #000; color: #fff; padding: 30px; border-radius: 15px; width: 90%; max-width: 600px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4); text-align: center} h2{ margin-bottom: 20px} .option{ background: #222; padding: 10px 15px; margin: 10px 0; border-radius: 8px; cursor: pointer; transition: background 0.3s; font-size: 1.2rem; font-weight: 400} .option:hover{ background: #333} .option.selected{ background: #ff9800} .option.disabled{ pointer-events: none; opacity: 0.6} .btn{ margin-top: 20px; padding: 10px 20px; border: none; background: #ff9800; color: #fff; font-weight: bold; border-radius: 8px; cursor: pointer} .btn:hover{ background: #301e02} .result{ margin-top: 20px; font-size: 22px; font-weight: bold} .congrats{ font-size: 24px; margin-top: 15px; color: #4caf50; animation: fadeIn 2s ease-in-out} .progress{ margin-bottom: 30px; font-size: 18px; color: #fff; background: linear-gradient(90deg, #ff9800, #ff5722); padding: 10px 20px; border-radius: 8px; font-weight: bold; height: 6vh; box-shadow: 0 0 10px rgba(255, 152, 0, 0.5)} #question{ color: white} @keyframes fadeIn{ from{ opacity: 0} to{ opacity: 1}} </style></head><body><nav class="navbar navbar-expand-lg bg-white navbar-light shadow sticky-top p-0"><a href="index.html" class="navbar-brand d-flex align-items-center px-4 px-lg-5"><p class="m-0 fw-bold" style="font-size: 25px;"><img src="img/icon.png" alt="icon" height="50px">Tayyari<span style="color: #fb873f;">Express</span></p></a><button class="navbar-toggler me-4" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse" style="border: none;"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="navbarCollapse"><div class="navbar-nav ms-auto p-4 p-lg-0"><a href="index.html" class="nav-item nav-link ">Home</a><a href="about.html" class="nav-item nav-link">About</a><a href="courses.html" class="nav-item nav-link">Notes & PYQs</a><a href="quizzos.html" class="nav-item nav-link">Quizzos</a><div class="nav-item dropdown"><a href="#" class="nav-link dropdown-toggle" data-bs-toggle="dropdown">Pages</a><div class="dropdown-menu fade-down m-0"><a href="team.html" class="dropdown-item">Our Team</a><a href="testimonial.html" class="dropdown-item">Testimonial</a><a href="blog.html" class="dropdown-item">Blogs & Posts</a></div></div><a href="contact.html" class="nav-item nav-link">Contact</a><a href="login.html" class="nav-item nav-link"><i class="fa fa-user"></i></a><a href="#" class="nav-item nav-link"><div id="google_translate_element"></div></a></div></div></nav><div class="main-quiz"><div class="quiz-container"><div class="progress" id="progressText">Question 1 of 20</div><h2 id="question">Loading question...</h2><div id="options"></div><button class="btn" id="nextBtn">Next</button><div class="result" id="result"></div><div class="congrats" id="congrats"></div><button class="btn" id="restartBtn" style="display:none;">Retake Quiz</button></div></div><script>window.addEventListener("DOMContentLoaded", function (){ console.log("Simulated defer");}); const quizData=[{ question: "What is the correct file extension for Java files?", options: [".java", ".js", ".class", ".jav"], correct: 0},{ question: "Which of the following is a primitive data type in Java?", options: ["String", "int", "ArrayList", "HashMap"], correct: 1},{ question: "Which method is used to start a thread in Java?", options: ["start()", "run()", "init()", "execute()"], correct: 0},{ question: "Which of these is used to import a package in Java?", options: ["import", "package", "include", "use"], correct: 0},{ question: "What is the default value of a boolean variable in Java?", options: ["true", "false", "0", "null"], correct: 1},{ question: "What is the correct way to declare a constant in Java?", options: ["final int x=10;", "const int x=10;", "int final x=10;", "final x=10;"], correct: 0},{ question: "Which of these is a valid class declaration in Java?", options: ["public class MyClass{}", "public MyClass class{}", "class public MyClass{}", "MyClass public class{}"], correct: 0},{ question: "Which keyword is used to inherit a class in Java?", options: ["extends", "inherits", "super", "implements"], correct: 0},{ question: "What is the output of 'System.out.println(10 + 5)'?", options: ["10", "15", "105", "Error"], correct: 1},{ question: "Which method is used to find the length of an array in Java?", options: ["length()", "size()", "length", "getLength()"], correct: 2},{ question: "What is the default value of a reference variable in Java?", options: ["null", "0", "empty string", "undefined"], correct: 0},{ question: "Which of the following is true about Java?", options: ["Java is platform dependent.", "Java is platform independent.", "Java is not an object-oriented language.", "Java uses pointers."], correct: 1},{ question: "Which keyword is used to define an interface in Java?", options: ["interface", "implements", "abstract", "class"], correct: 0},{ question: "Which of the following is not a valid access modifier in Java?", options: ["public", "private", "protected", "secure"], correct: 3},{ question: "Which exception is thrown when dividing by zero in Java?", options: ["ArithmeticException", "NullPointerException", "IOException", "IndexOutOfBoundsException"], correct: 0},{ question: "Which method is used to compare two strings in Java?", options: ["compare()", "equals()", "compareTo()", "isEqual()"], correct: 1},{ question: "What does JVM stand for?", options: ["Java Variable Machine", "Java Virtual Method", "Java Version Machine", "Java Virtual Machine"], correct: 3},{ question: "What is the correct way to declare an array in Java?", options: ["int[] arr;", "int arr[];", "int[] arr[];", "int arr;"], correct: 1},{ question: "What is the base class for all classes in Java?", options: ["Object", "Base", "Class", "Main"], correct: 0},{ question: "Which of these is a method to print text in Java?", options: ["System.out.print()", "System.out.println()", "System.out.display()", "System.print()"], correct: 1}]; const questionEl=document.getElementById("question"), optionsEl=document.getElementById("options"), nextBtn=document.getElementById("nextBtn"), resultEl=document.getElementById("result"), congratsEl=document.getElementById("congrats"), restartBtn=document.getElementById("restartBtn"), progressText=document.getElementById("progressText"); let currentQuestion=0, score=0; function loadQuestion(){ const q=quizData[currentQuestion]; questionEl.textContent=`${currentQuestion + 1}. ${q.question}`; progressText.textContent=`Question ${currentQuestion + 1} of ${quizData.length}`; optionsEl.innerHTML=""; q.options.forEach((opt, i)=>{ const div=document.createElement("div"); div.className="option"; div.textContent=opt; div.onclick=()=>selectOption(div, i); optionsEl.appendChild(div)})} function selectOption(e, i){ document.querySelectorAll(".option").forEach(opt=>opt.classList.remove("selected")); e.classList.add("selected"); e.dataset.selectedIndex=i} function checkAnswer(){ const selected=document.querySelector(".option.selected"); if (!selected) return; const index=Number(selected.dataset.selectedIndex); if (index===quizData[currentQuestion].correct) score++; currentQuestion++; currentQuestion < quizData.length ? loadQuestion() : showResult()} function showResult(){ questionEl.style.display=optionsEl.style.display=nextBtn.style.display="none"; resultEl.textContent=`Your Score: ${score} / ${quizData.length}`; congratsEl.textContent=score===quizData.length ? "Perfect! 🎉" : "Good job! 🎯"; restartBtn.style.display="inline-block"} nextBtn.onclick=checkAnswer; restartBtn.onclick=()=>{ currentQuestion=score=0; questionEl.style.display=optionsEl.style.display=nextBtn.style.display="block"; resultEl.textContent=congratsEl.textContent=""; restartBtn.style.display="none"; loadQuestion()}; loadQuestion(); </script></body><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script></html>
