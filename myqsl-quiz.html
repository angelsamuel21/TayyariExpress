iv class="quiz-container"><div class="progress" id="progressText">Question 1 of 20</div><h2 id="question">Loading question...</h2><div id="options"></div><button class="btn" id="nextBtn">Next</button><div class="result" id="result"></div><div class="congrats" id="congrats"></div><button class="btn" id="restartBtn" style="display:none;">Retake Quiz</button></div></div><script>window.addEventListener("DOMContentLoaded", function (){ console.log("Simulated defer");}); const quizData=[{ question: "What is the correct file extension for MySQL scripts?", options: [".sql", ".mysql", ".db", ".script"], correct: 0},{ question: "Which command is used to create a database in MySQL?", options: ["CREATE DATABASE", "NEW DATABASE", "INIT DATABASE", "MAKE DATABASE"], correct: 0},{ question: "What is the default port for MySQL?", options: ["3306", "8080", "5432", "1521"], correct: 0},{ question: "Which command is used to display all databases in MySQL?", options: ["SHOW DATABASES", "LIST DATABASES", "DISPLAY DATABASES", "VIEW DATABASES"], correct: 0},{ question: "What is a primary key in MySQL?", options: ["A unique identifier for a table", "A foreign key", "A duplicate column", "A reserved keyword"], correct: 0},{ question: "Which data type is used to store large text in MySQL?", options: ["VARCHAR", "TEXT", "TINYTEXT", "LONGTEXT"], correct: 3},{ question: "Which clause is used to filter rows in MySQL?", options: ["WHERE", "FILTER", "SEARCH", "CONDITION"], correct: 0},{ question: "What is the purpose of the GROUP BY clause in MySQL?", options: ["To group rows with the same values", "To sort rows", "To delete rows", "To join rows"], correct: 0},{ question: "What does the JOIN keyword do in MySQL?", options: ["Combines rows from two or more tables", "Deletes rows", "Creates a new table", "Updates existing rows"], correct: 0},{ question: "Which function is used to find the maximum value in a column?", options: ["MAX()", "HIGHEST()", "TOP()", "UPPER()"], correct: 0},{ question: "Which elected=false; function loadQuestion(){ const q=quizData[currentQuestion]; questionEl.textContent=q.question; optionsEl.innerHTML=""; q.options.forEach((option, index)=>{ const optionEl=document.createElement("div"); optionEl.classList.add("option"); optionEl.textContent=option; optionEl.addEventListener("click", ()=>selectOption(optionEl, index)); optionsEl.appendChild(optionEl);}); progressText.textContent=`Question ${currentQuestion + 1} of ${quizData.length}`; nextBtn.disabled=true; selected=false;} function selectOption(optionEl, index){ if (selected) return; selected=true; const allOptions=document.querySelectorAll(".option"); allOptions.forEach(opt=>{ opt.classList.add("disabled");}); if (index===quizData[currentQuestion].correct){ score++; optionEl.classList.add("selected");} else{ optionEl.style.backgroundColor="#e74c3c";} nextBtn.disabled=false;} function showResult(){ questionEl.style.display="none"; optionsEl.style.display="none"; nextBtn.style.display="none"; progressText.style.display="none"; resultEl.textContent=`You scored ${score} out of ${quizData.length}`; congratsEl.textContent=score >=15 ? "🎉 Great job! You're MySQL smart!" : "Keep practicing, you're getting there!"; restartBtn.style.display="inline-block";} nextBtn.addEventListener("click", ()=>{ currentQuestion++; if (currentQuestion < quizData.length){ loadQuestion();} else{ showResult();}}); restartBtn.addEventListener("click", ()=>{ currentQuestion=0; score=0; questionEl.style.display="block"; optionsEl.style.display="block"; nextBtn.style.display="inline-block"; progressText.style.display="block"; resultEl.textContent=""; congratsEl.textContent=""; restartBtn.style.display="none"; loadQuestion();}); loadQuestion(); </script></body><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script></html>
