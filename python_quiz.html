lt{ margin-top: 20px; font-size: 22px; font-weight: bold;} .congrats{ font-size: 24px; margin-top: 15px; color: #4caf50; animation: fadeIn 2s ease-in-out;} .progress{ margin-bottom: 30px; font-size: 18px; color: #fff; background: linear-gradient(90deg, #ff9800, #ff5722); padding: 10px 20px; border-radius: 8px; font-weight: bold; height: 6vh; box-shadow: 0 0 10px rgba(255, 152, 0, 0.5);} #question{ color: white;} @keyframes fadeIn{ from{ opacity: 0;} to{ opacity: 1;}} </style></head><body><nav class="navbar navbar-expand-lg bg-white navbar-light shadow sticky-top p-0"><a href="index.html" class="navbar-brand d-flex align-items-center px-4 px-lg-5"><p class="m-0 fw-bold" style="font-size: 25px;"><img src="img/icon.png" alt="icon" height="50px">Tayyari<span style="color: #fb873f;">Express</span></p></a><button class="navbar-toggler me-4" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse" style="border: none;"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="navbarCollapse"><div class="navbar-nav ms-auto p-4 p-lg-0"><a href="index.html" class="nav-item nav-link ">Home</a><a href="about.html" class="nav-item nav-link">About</a><a href="courses.html" class="nav-item nav-link">Notes & PYQs</a><a href="quizzos.html" class="nav-item nav-link">Quizzos</a><div class="nav-item dropdown"><a href="#" class="nav-link dropdown-toggle" data-bs-toggle="dropdown">Pages</a><div class="dropdown-menu fade-down m-0"><a href="team.html" class="dropdown-item">Our Team</a><a href="testimonial.html" class="dropdown-item">Testimonial</a><a href="blog.html" class="dropdown-item">Blogs & Posts</a></div></div><a href="contact.html" class="nav-item nav-link">Contact</a><a href="login.html" class="nav-item nav-link"><i class="fa fa-user"></i></a><a href="#" class="nav-item nav-link"><div id="google_translate_element"></div></a></div></div></nav><div class="main-quiz"><div class="quiz-container"><div class="progress" id="progressText">Question 1 of 20</div><h2 id="question">Loading question...</h2><div id="options"></div><button class="btn" id="nextBtn">Next</button><div class="result" id="result"></div><div class="congrats" id="congrats"></div><button class="btn" id="restartBtn" style="display:none;">Retake Quiz</button></div></div>
    <script>
        window.addEventListener("DOMContentLoaded", function () {console.log("Simulated defer");});
        const quizData = [{ question: "What is the correct file extension for Python files?", options: [".py", ".java", ".txt", ".pyth"], correct: 0 }, { question: "Which of the following is a mutable data type in Python?", options: ["Tuple", "String", "List", "Set"], correct: 2 }, { question: "Which keyword is used to create a function in Python?", options: ["func", "define", "def", "lambda"], correct: 2 }, { question: "Which of these is used to include a module in Python?", options: ["import", "use", "include", "require"], correct: 0 }, { question: "What is the output of 'print(type([]))' in Python?", options: ["<class 'list'>", "<class 'dict'>", "<class 'tuple'>", "<class 'set'>"], correct: 0 }, { question: "What is the correct way to declare a constant in Python?", options: ["CONST x=10", "x=10", "constant x=10", "There is no keyword for constants"], correct: 3 }, { question: "Which of these is the correct syntax for a class in Python?", options: ["class MyClass{}", "class MyClass:", "class MyClass()", "MyClass class{}"], correct: 1 }, { question: "What is the output of 'print(10 // 3)' in Python?", options: ["3.33", "3", "4", "Error"], correct: 1 }, { question: "Which function is used to find the length of a list in Python?", options: ["length()", "len()", "size()", "count()"], correct: 1 }, { question: "What is the default value of a variable that is not initialized in Python?", options: ["None", "0", "undefined", "Error"], correct: 0 }, { question: "What is the correct syntax to output 'Hello, World!' in Python?", options: ["echo 'Hello, World!'", "print('Hello, World!')", "console.log('Hello, World!')", "printf('Hello, World!')"], correct: 1 }, { question: "What is the difference between 'is' and '==' in Python?", options: ["'is' checks identity, '==' checks equality", "'is' checks equality, '==' checks identity", "Both perform the same function", "'is' compares types only"], correct: 0 }, { question: "How do you declare a variable in Python?", options: ["var x=10", "x=10", "int x=10", "let x=10"], correct: 1 }, { question: "Which of these is not a valid Python keyword?", options: ["global", "nonlocal", "static", "lambda"], correct: 2 }, { question: "Which of the following is not a Python data type?", options: ["int", "float", "str", "real"], correct: 3 }, { question: "What is the output of 'print('a' * 3)'?", options: ["aaa", "a3", "Error", "333"], correct: 0 }, { question: "Which method is used to add an element to a list in Python?", options: ["add()", "append()", "insert()", "push()"], correct: 1 }, { question: "What is the output of 'bool('False')' in Python?", options: ["False", "True", "Error", "None"], correct: 1 }, { question: "Which of these is a Python built-in function?", options: ["sum()", "average()", "mean()", "median()"], correct: 0 }, { question: "How do you create a comment in Python?", options: ["// Comment", "# Comment", "/* Comment */", "<!-- Comment -->"] ,correct : 1}];
        const questionEl = document.getElementById("question"), optionsEl = document.getElementById("options"), nextBtn = document.getElementById("nextBtn"), resultEl = document.getElementById("result"), congratsEl = document.getElementById("congrats"), restartBtn = document.getElementById("restartBtn"), progressText = document.getElementById("progressText"); let currentQuestion = 0, score = 0;
        function loadQuestion() { const q = quizData[currentQuestion]; questionEl.textContent = `${currentQuestion + 1}. ${q.question}`; progressText.textContent = `Question ${currentQuestion + 1} of ${quizData.length}`; optionsEl.innerHTML = ""; q.options.forEach((opt, i) => { const div = document.createElement("div"); div.className = "option"; div.textContent = opt; div.onclick = () => selectOption(div, i); optionsEl.appendChild(div); }); }
        function selectOption(e, i) { document.querySelectorAll(".option").forEach(o => o.classList.remove("selected")); e.classList.add("selected"); e.dataset.selectedIndex = i; }
        function checkAnswer() { const s = document.querySelector(".option.selected"); if (!s) return; const i = Number(s.dataset.selectedIndex); if (i === quizData[currentQuestion].correct) score++; currentQuestion++; currentQuestion < quizData.length ? loadQuestion() : showResult(); }
        function showResult() { questionEl.style.display = optionsEl.style.display = nextBtn.style.display = "none"; resultEl.textContent = `Your Score: ${score} / ${quizData.length}`; congratsEl.textContent = score === quizData.length ? "Perfect! 🎉" : "Good job! 🎯"; restartBtn.style.display = "inline-block"; }
        nextBtn.onclick = checkAnswer;
        restartBtn.onclick = () => { currentQuestion = score = 0; questionEl.style.display = optionsEl.style.display = nextBtn.style.display = "block"; resultEl.textContent = congratsEl.textContent = ""; restartBtn.style.display = "none"; loadQuestion(); };
        loadQuestion();



    </script>
